<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>Aether - Sign In</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-wrapper">
        <section class="login-card" aria-labelledby="login-heading">
            <div class="login-logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>

            <h1 id="login-heading" class="login-title">AETHER</h1>
            <p id="loginGreeting" class="login-desc"></p>

            <form id="loginForm" class="login-form" novalidate>
                <div class="field-group" id="usernameGroup">
                    <label class="field-label" for="loginUsername">Email or Username</label>
                    <div class="field-wrap" id="usernameWrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="loginUsername" class="field-input" placeholder="Enter your username" autocomplete="username" required aria-describedby="usernameError">
                    </div>
                    <span class="field-error" id="usernameError" role="alert" aria-live="polite"></span>
                </div>

                <div class="field-group" id="passwordGroup">
                    <label class="field-label" for="loginPassword">Password</label>
                    <div class="field-wrap" id="passwordWrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="loginPassword" class="field-input" placeholder="Enter your password" autocomplete="current-password" required aria-describedby="passwordError">
                        <button type="button" id="togglePassword" class="toggle-pass-btn" aria-label="Show password">
                            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <span class="field-error" id="passwordError" role="alert" aria-live="polite"></span>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        <span class="remember-text">Remember me</span>
                    </label>
                    <button type="button" id="forgotPasswordBtn" class="forgot-link">Forgot password?</button>
                </div>

                <button type="submit" id="loginBtn" class="login-button">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loading" aria-hidden="true">
                        <span class="spinner"></span>
                        Signing in...
                    </span>
                    <span class="btn-success" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        Success
                    </span>
                </button>

                <div id="statusMessage" class="status-msg" role="alert" aria-live="polite"></div>
            </form>

            <div class="login-divider">
                <span class="divider-line"></span>
            </div>

            <footer class="login-footer">
                <span class="footer-credit">Tabeer Ahmad &middot; Advanced Tracking Technologies</span>
                <span class="footer-copy">&copy; 2026 Aether. All rights reserved.</span>
            </footer>
        </section>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="modal-overlay" aria-hidden="true">
        <section class="modal-card" aria-labelledby="forgot-heading">
            <div class="forgot-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1"/><line x1="12" y1="13" x2="12" y2="14.5"/></svg>
            </div>
            <h2 id="forgot-heading" class="modal-title">Reset Password</h2>
            <p class="modal-desc">Enter the Reset PIN shown in Settings when you created your password.</p>

            <form id="forgotForm" novalidate>
                <div class="field-group">
                    <label class="field-label" for="resetPinInput">Reset PIN</label>
                    <div class="field-wrap" id="pinWrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><line x1="8" y1="15" x2="16" y2="15"/></svg>
                        <input type="text" id="resetPinInput" class="field-input" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" aria-describedby="pinError" style="font-family:monospace; letter-spacing:0.15em; font-weight:700;">
                    </div>
                    <span class="field-error" id="pinError" role="alert" aria-live="polite"></span>
                </div>

                <button type="submit" id="verifyPinBtn" class="login-button forgot-btn">
                    <span class="btn-text">Verify PIN</span>
                    <span class="btn-loading" aria-hidden="true"><span class="spinner"></span>Verifying...</span>
                    <span class="btn-success" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>Verified</span>
                </button>
            </form>

            <button type="button" id="closeForgotModal" class="modal-close-link">Back to Sign In</button>
        </section>
    </div>

    <!-- New Password Modal -->
    <div id="newPassModal" class="modal-overlay" aria-hidden="true">
        <section class="modal-card" aria-labelledby="newpass-heading">
            <div class="newpass-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
            </div>
            <h2 id="newpass-heading" class="modal-title">Create New Password</h2>
            <p class="modal-desc">Set a new password to secure your app.</p>

            <form id="newPassForm" novalidate>
                <div class="field-group">
                    <label class="field-label" for="newPassInput">New Password</label>
                    <div class="field-wrap" id="newPassWrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="newPassInput" class="field-input" placeholder="Minimum 8 characters" autocomplete="new-password" aria-describedby="newPassError">
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label" for="confirmPassInput">Confirm Password</label>
                    <div class="field-wrap" id="confirmPassWrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="confirmPassInput" class="field-input" placeholder="Re-enter password" autocomplete="new-password" aria-describedby="newPassError">
                    </div>
                    <span class="field-error" id="newPassError" role="alert" aria-live="polite"></span>
                </div>

                <button type="submit" id="savePassBtn" class="login-button success-btn">
                    <span class="btn-text">Save Password</span>
                    <span class="btn-loading" aria-hidden="true"><span class="spinner"></span>Saving...</span>
                    <span class="btn-success" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>Saved</span>
                </button>
            </form>

            <button type="button" id="closeNewPassModal" class="modal-close-link">Back to Sign In</button>
        </section>
    </div>

    <script src="dexie.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
